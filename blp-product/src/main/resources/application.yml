server:
  port: 9003

spring:
  application:
    name: blp-product
  datasource:
    url: jdbc:mysql://localhost:3307/blp_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: blp-product

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
