server:
  port: 9012

spring:
  application:
    name: blp-file
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

minio:
  endpoint: http://localhost:9000
  access-key: minio
  secret-key: minioadmin
  bucket: blp-product

knife4j:
  enable: true
